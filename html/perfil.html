<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/perfil.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
</head>
<body>

     <main class="pagina-perfil">

        <a href="tarefas.html" class="voltar">Voltar</a>

        <section class="perfil-container">

            <div class="perfil-imagem">
                <img src="../img/perfil.png" alt="Ícone de perfil">
            </div>

            <h1>Meu Perfil</h1>

            <div class="informacoes-perfil">

                <div class="informacao">
                    <span>Nome</span>
                    <p id="nomePerfil">Nome do usuário</p>
                </div>

                <div class="informacao">
                    <span>E-mail</span>
                    <p id="emailPerfil">email@exemplo.com</p>
                </div>

                <div class="informacao">
                    <span>Total de tarefas</span>
                    <p id="total-tarefas">0</p>
                </div>

                <div class="informacao">
                    <span>Tarefas concluídas</span>
                    <p id="tarefas-concluidas">0</p>
                </div>

            </div>

            <div class="acoes-perfil">

                <button id="sair">Sair</button>

            </div>

        </section>

    </main>

    <script src="../js/script.js"></script>

    
</body>
</html>
